<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Page</title>
    <!-- മെയിൻ സ്റ്റൈൽഷീറ്റ് -->
    <link rel="stylesheet" href="style.css">
    
    <!-- പ്രൊഡക്റ്റ് പേജിന് മാത്രമുള്ള പ്രത്യേക ഡിസൈൻ (CSS) -->
    <style>
        .product-container {
            display: flex;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            gap: 50px;
            font-family: sans-serif;
        }
        .product-images { flex: 1; text-align: center; }
        .product-images img { max-width: 100%; height: auto; border-radius: 8px; }
        .product-details { flex: 1; }
        .product-title { font-size: 28px; margin-bottom: 10px; color: #333; }
        .product-price { margin-bottom: 20px; }
        .discount-price { font-size: 24px; font-weight: bold; color: #e44d26; }
        .original-price { font-size: 18px; text-decoration: line-through; color: #999; margin-left: 10px; }
        .product-desc { color: #666; line-height: 1.6; margin-bottom: 30px; }
        .purchase-buttons { display: flex; gap: 20px; }
        .btn-cart, .btn-buy { padding: 15px 30px; font-size: 16px; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .btn-cart { background-color: #f0f0f0; color: #333; }
        .btn-buy { background-color: #000; color: #fff; flex: 1; }
        .btn-buy:hover { background-color: #333; }
        @media (max-width: 768px) { .product-container { flex-direction: column; } }
    </style>
</head>
<body>

    <!-- ഹെഡർ (ലോഗോ ഭാഗം) -->
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">
                <img src="./images/logo.png" alt="Logo" style="height: 45px; width: auto;">
            </a>
        </div>
    </header>

    <!-- പ്രൊഡക്റ്റ് മെയിൻ ഭാഗം -->
    <main class="product-container">
        <div class="product-images">
            <!-- തൽക്കാലം ഒരു ഡമ്മി ചിത്രം, ഇത് പിന്നീട് മാറ്റാം -->
            <img src="https://unsplash.com" alt="Product Image">
        </div>

        <div class="product-details">
            <h1 class="product-title">Premium Running Shoes</h1>
            <div class="product-price">
                <span class="discount-price">₹1,499</span>
                <span class="original-price">₹2,499</span>
            </div>
            <p class="product-desc">High-quality comfortable sports shoes designed for maximum durability and style. Perfect for running and casual wear.</p>
            
            <div class="purchase-buttons">
                <button class="btn-cart">Add to Cart</button>
                <button class="btn-buy">Buy Now</button>
            </div>
        </div>
    </main>

    <!-- ഫൂട്ടർ ഭാഗം -->
    <footer class="footer" style="padding: 40px 20px; background: #111; color: #fff; text-align: center; margin-top: 50px;">
        <a href="index.html" class="logo">
            <img src="./images/logo.png" alt="Footer Logo" style="height: 40px; width: auto;">
        </a>
        <p style="margin-top: 20px; color: #666;">© 2026 CreativeStudio. All rights reserved.</p>
    </footer>

</body>
</html>
